apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: ct8395459/dc-jewelry-backend
    newName: ct8395459/dc-jewelry-backend
    # scripts/deploy.sh replaces this with the immutable tag published by
    # DCJewelry GitHub Actions, for example sha-0123abcd....
    newTag: sha-unset
  - name: ct8395459/dc-jewelry-frontend
    newName: ct8395459/dc-jewelry-frontend
    # Backend and frontend can be promoted independently when necessary.
    newTag: sha-unset
