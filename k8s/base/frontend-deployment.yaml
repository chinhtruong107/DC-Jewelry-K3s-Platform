apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcjewelry-frontend
  namespace: dcjewelry
  labels:
    app.kubernetes.io/name: dcjewelry-frontend
    app.kubernetes.io/part-of: dcjewelry
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dcjewelry-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcjewelry-frontend
        app.kubernetes.io/part-of: dcjewelry
    spec:
      serviceAccountName: dcjewelry-workload
      nodeSelector:
        dcjewelry.io/workload: private
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dcjewelry-frontend
      containers:
        - name: frontend
          image: ct8395459/dc-jewelry-frontend:sha-unset
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: dcjewelry-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
