# Copy this file to secret.yaml, replace every CHANGE_ME value, then apply it.
# secret.yaml is intentionally excluded from Git.
apiVersion: v1
kind: Secret
metadata:
  name: dcjewelry-backend-secrets
  namespace: dcjewelry
type: Opaque
stringData:
  APP_KEY: CHANGE_ME_BASE64_LARAVEL_APP_KEY
  DB_HOST: CHANGE_ME_PRIVATE_RDS_ENDPOINT
  DB_DATABASE: dcjewelry
  DB_USERNAME: CHANGE_ME
  DB_PASSWORD: CHANGE_ME
